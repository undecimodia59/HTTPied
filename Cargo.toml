[workspace]
members = ["."]
resolver = "2"

[package]
name = "httpied"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = []
ui = ["dep:eframe", "tls-spike"]
tls-spike = ["dep:tokio-rustls", "dep:rcgen", "dep:webpki-roots", "dep:time"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
url = "2.5"
percent-encoding = "2"
base64 = "0.22"
flate2 = "1"
shlex = "1.3"
h2 = "0.4"
bytes = "1"
futures-util = {version="0.3",features=["sink"]}
tokio-tungstenite = {version="0.28",default-features=false,features=["handshake"]}
brotli = "8"
fs2 = "0.4"
quick-xml = "0.38"
sha2 = "0.10"

time = { version = "0.3", optional = true }
tokio-rustls = { version = "0.26.6", optional = true, default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14.10", optional = true, features = ["x509-parser"] }
webpki-roots = { version = "1", optional = true }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
httparse = "1.10.1"
http = "1.5.0"
tracing = "0.1.44"
eframe = { version = "0.36.2", optional = true, default-features = false, features = ["glow", "x11", "wayland", "default_fonts", "accesskit"] }

[[example]]
name = "ui_layout"
required-features = ["ui"]
